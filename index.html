<!doctype html>
<html lang="en">
    <head>
        <!-- Basic Meta -->
        <title>Travel Point</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta -->
        <meta
            name="description"
            content="Discover amazing destinations, travel guides, and tips with Travel Point. Plan your perfect trip today."
        />
        <meta
            name="keywords"
            content="travel, tourism, destinations, trips, vacation, travel guide"
        />
        <meta name="author" content="Kritman Rao" />

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="src/assets/icons/logo-main.png"
            type="image/x-icon"
        />

        <!-- Circular Std font-family link  -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />

        <!-- Google Fonts (Inter) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Styles   -->
        <link rel="stylesheet" href="src/styles/main.css" />
    </head>
    <body>
        <header class="header">
            <nav class="nav" aria-label="Primary navigation">
                <!-- Hamburger Menu Button  -->
                <button
                    type="button"
                    class="nav__menu btn--none"
                    aria-label="open navigation menu"
                    aria-expanded="false"
                    aria-controls="hamburger-menu"
                >
                    <img
                        src="src/assets/icons/hamburger.png"
                        alt="hamburger menu icon"
                    />
                </button>

                <!-- website Logo -->
                <a
                    href="/"
                    aria-label="Travel Point Home"
                    class="nav__logo a--none"
                >
                    <img
                        src="src/assets/icons/logo-main.png"
                        alt="Travel Point Logo"
                    />
                </a>

                <!-- Desktop Navigation Links -->
                <ul class="nav__links-lg nav__links--lg" id="nav-links">
                    <li class="li--none nav--active">
                        <a class="a--none nav--links" href="/">home</a>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#discover"
                            >Discover</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#deals"
                            >Special Deals</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#contact"
                            >Contact</a
                        >
                    </li>
                </ul>

                <!-- Authentication Buttons -->
                <div class="nav__auth" id="nav-auth">
                    <button type="button" class="btn btn--none">Log In</button>
                    <button type="button" class="btn btn--primary btn--none">
                        Sign Up
                    </button>
                </div>
            </nav>
            <!-- 
            ------------------------------------------------------------------------------------
                        Mobile Sidebar Navigation 
            ------------------------------------------------------------------------------------
             -->
            <aside id="hamburger-menu" class="aside aside--disabled">
                <!-- Sidebar Links -->
                <ul class="aside__links">
                    <li class="li--none">
                        <button type="button" class="btn">X</button>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="/">home</a>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#discover"
                            >Discover</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#deals"
                            >Special Deals</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#contact"
                            >Contact</a
                        >
                    </li>
                </ul>
            </aside>
        </header>

        <!-- 
        ---------------------------------------------------------------------------------
                                    Main Content
        ---------------------------------------------------------------------------------
         -->
        <main class="main">
            <section class="hero" aria-labelledby="hero-heading">
                <div
                    class="hero__ellipse hero__ellipse--gradient"
                    aria-hidden="true"
                ></div>

                <article class="content">
                    <div class="content__text">
                        <span class="content__badge">
                            Explore the world!
                            <img
                                class="content__badge-icon"
                                src="./src/assets/icons/bag-icon.png"
                                alt=""
                                aria-hidden="true"
                            />
                        </span>

                        <h1 id="content-heading" class="content__title">
                            Travel
                            <span class="content__title--accent"
                                >top destination</span
                            >
                            of the world
                        </h1>
                    </div>
                    <p class="content__description">
                        We always make our customer happy by
                        <span class="content__description--w-full"
                            >providing</span
                        >
                        as many choices as possible
                    </p>

                    <div class="content__actions">
                        <button class="btn btn--primary">Get Started</button>

                        <button
                            class="btn btn--secondary"
                            aria-label="Watch video demo of our travel services"
                        >
                            <img
                                class="btn__icon"
                                src="./src/assets/icons/play.png"
                                alt=""
                                aria-hidden="true"
                            />
                            Watch Demo
                        </button>
                    </div>
                </article>

                <figure
                    class="gallery"
                    aria-label="Photo gallery of global travel destinations"
                >
                    <img
                        class="gallery__bg-layer"
                        src="./src/assets/images/layer.png"
                        alt="Illustration of planet Earth in the background"
                    />

                    <div class="gallery__cards-container">
                        <div class="gallery__cards-container-left">
                            <img
                                class="gallery__card-img--top"
                                src="./src/assets/images/hero-travel-1.jpg"
                                alt="Scenic ocean water view from a stone stairway"
                            />
                            <img
                                class="gallery__card-img--right"
                                src="./src/assets/images/hero-travel-3.jpg"
                                alt="Hiker taking a photograph of a vast mountain view"
                            />
                        </div>

                        <img
                            class="gallery__card-img--bottom"
                            src="./src/assets/images/hero-travel-2.jpg"
                            alt="Traveler sitting and looking out over a mountain landscape"
                        />
                        <!-- icons -->
                        <img
                            class="gallery__floating-icon gallery__floating-icon--send"
                            src="./src/assets/icons/send-icon.png"
                            alt=""
                            aria-hidden="true"
                        />
                        <img
                            class="gallery__floating-icon gallery__floating-icon--contact"
                            src="./src/assets/images/contact.png"
                            alt=""
                            aria-hidden="true"
                        />
                        <span
                            class="gallery__floating-icon gallery__floating-badge"
                        >
                            <img
                                class="gallery__floating-icon--location"
                                src="./src/assets/images/location-img.png"
                                alt=""
                                aria-hidden="true"
                            />
                            Top Places
                        </span>
                    </div>
                </figure>
                <img
                    class="hero__floating-icon hero__floating-icon--triangle"
                    src="/src/assets/images/triangle-grp.png"
                    alt=""
                />
            </section>

            <section class="brand" aria-label="Our trusted travel partners">
                <ul class="brand__list">
                    <li class="brand__item">
                        <img
                            class="brand__item-img"
                            src="/src/assets/images/tripadviser.png"
                            alt="Trip visitor"
                        />
                    </li>
                    <li class="brand__item">
                        <img
                            class="brand__item-img"
                            src="/src/assets/images/expedia.png"
                            alt="Expedia"
                        />
                    </li>
                    <li class="brand__item">
                        <img
                            class="brand__item-img"
                            src="/src/assets/images/booking.png"
                            alt="Booking"
                        />
                    </li>
                    <li class="brand__item">
                        <img
                            class="brand__item-img"
                            src="/src/assets/images/airbnb.png"
                            alt="Airhub"
                        />
                    </li>
                    <li class="brand__item">
                        <img
                            class="brand__item-img"
                            src="/src/assets/images/ribitz.png"
                            alt="Ribitz"
                        />
                    </li>
                </ul>
            </section>
        </main>
        <!-- 
        ---------------------------------------------------------------------------------
                                    Main JavaScript Entry Point
        ---------------------------------------------------------------------------------
         -->
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
