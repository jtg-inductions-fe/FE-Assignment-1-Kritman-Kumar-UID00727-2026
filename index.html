<!doctype html>
<html lang="en">
    <head>
        <!-- Basic Meta -->
        <title>Travel Point</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta -->
        <meta
            name="description"
            content="Discover amazing destinations, travel guides, and tips with Travel Point. Plan your perfect trip today."
        />
        <meta
            name="keywords"
            content="travel, tourism, destinations, trips, vacation, travel guide"
        />
        <meta name="author" content="Kritman Rao" />

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="src/assets/icons/logo-main.png"
            type="image/x-icon"
        />

        <!-- Circular Std font-family link  -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />

        <!-- Google Fonts (Inter) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Styles   -->
        <link rel="stylesheet" href="src/styles/main.css" />
    </head>
    <body>
        <header class="header">
            <nav class="nav" aria-label="Primary navigation">
                <!-- Hamburger Menu Button  -->
                <button
                    type="button"
                    class="nav__menu btn--none"
                    aria-label="open navigation menu"
                    aria-expanded="false"
                    aria-controls="hamburger-menu"
                >
                    <img
                        src="src/assets/icons/hamburger.png"
                        alt="hamburger menu icon"
                    />
                </button>

                <!-- website Logo -->
                <a
                    href="/"
                    aria-label="Travel Point Home"
                    class="nav__logo a--none"
                >
                    <img
                        src="src/assets/icons/logo-main.png"
                        alt="Travel Point Logo"
                    />
                </a>

                <!-- Desktop Navigation Links -->
                <ul class="nav__links-lg nav__links--lg" id="nav-links">
                    <li class="li--none nav--active">
                        <a class="a--none nav--links" href="/">home</a>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#discover"
                            >Discover</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#deals"
                            >Special Deals</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#contact"
                            >Contact</a
                        >
                    </li>
                </ul>

                <!-- Authentication Buttons -->
                <div class="nav__auth" id="nav-auth">
                    <button type="button" class="btn btn--none">Log In</button>
                    <button type="button" class="btn btn--primary btn--none">
                        Sign Up
                    </button>
                </div>
            </nav>
            <!-- 
            ------------------------------------------------------------------------------------
                        Mobile Sidebar Navigation 
            ------------------------------------------------------------------------------------
             -->
            <aside id="hamburger-menu" class="aside aside--disabled">
                <!-- Sidebar Links -->
                <ul class="aside__links">
                    <li class="li--none">
                        <button type="button" class="btn">X</button>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="/">home</a>
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#discover"
                            >Discover</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#deals"
                            >Special Deals</a
                        >
                    </li>
                    <li class="li--none">
                        <a class="a--none nav--links" href="#contact"
                            >Contact</a
                        >
                    </li>
                </ul>
            </aside>
        </header>

        <!-- 
        ---------------------------------------------------------------------------------
                                    Main Content
        ---------------------------------------------------------------------------------
         -->
        <main class="main">
            <section class="hero">
                <article class="hero__content">
                    <div class="hero__ellipse hero__content--gradient"></div>
                </article>
                <figure class="hero__image"></figure>
            </section>
        </main>

        <!-- 
        ---------------------------------------------------------------------------------
                                    Main JavaScript Entry Point
        ---------------------------------------------------------------------------------
         -->
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
