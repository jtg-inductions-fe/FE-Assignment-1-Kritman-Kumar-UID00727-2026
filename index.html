<!doctype html>
<html lang="en">
    <head>
        <!-- Basic Meta -->
        <title>Travel Point</title>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta -->
        <meta
            name="description"
            content="Discover amazing destinations, travel guides, and tips with Travel Point. Plan your perfect trip today."
        />
        <meta
            name="keywords"
            content="travel, tourism, destinations, trips, vacation, travel guide"
        />
        <meta name="author" content="Kritman Rao" />

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="src/assets/icons/logo-main.png"
            type="image/x-icon"
        />

        <!-- Circular Std font-family link  -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@vetixy/circular-std@1.0.0/dist/index.min.css"
        />

        <!-- font-awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />

        <!-- Google Fonts (Inter) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Styles   -->
        <link rel="stylesheet" href="src/styles/main.css" />
    </head>
    <body>
        <header class="header">
            <nav class="nav" aria-label="Primary navigation">
                <button
                    type="button"
                    class="nav__toggle"
                    aria-label="open navigation menu"
                    aria-expanded="false"
                    aria-controls="hamburger-menu"
                >
                    <img
                        src="src/assets/icons/hamburger.png"
                        alt="hamburger menu icon"
                    />
                </button>
                <a
                    href="/"
                    aria-label="Travel Point Home"
                    class="logo nav__logo"
                >
                    <img
                        src="src/assets/icons/logo-main.png"
                        alt="Travel Point Logo"
                    />
                </a>
                <ul class="nav__list nav__list--desktop" id="nav-links">
                    <li class="nav__item">
                        <a class="nav__link nav__link--active" href="/">home</a>
                    </li>
                    <li>
                        <a class="nav__link" href="#discover">Discover</a>
                    </li>
                    <li>
                        <a class="nav__link" href="#deals">Special Deals</a>
                    </li>
                    <li>
                        <a class="nav__link" href="#contact">Contact</a>
                    </li>
                </ul>
                <div class="nav__auth" id="nav-auth">
                    <button type="button" class="btn btn nav__btn">
                        Log In
                    </button>
                    <button type="button" class="btn btn nav__btn btn--primary">
                        Sign Up
                    </button>
                </div>
            </nav>

            <aside id="hamburger-menu" class="sidebar sidebar--disabled">
                <!-- Sidebar Links -->
                <ul class="sidebar__links">
                    <li>
                        <button type="button" class="btn sidebar__btn">
                            <i class="fa-solid fa-x"></i>
                        </button>
                    </li>
                    <li>
                        <a class="sidebar__link" href="/">home</a>
                    </li>
                    <li>
                        <a class="sidebar__link" href="#discover">Discover</a>
                    </li>
                    <li>
                        <a class="sidebar__link" href="#deals">Special Deals</a>
                    </li>
                    <li>
                        <a class="sidebar__link" href="#contact">Contact</a>
                    </li>
                </ul>
            </aside>
        </header>

        <!-- 
        ---------------------------------------------------------------------------------
                                    Main JavaScript Entry Point
        ---------------------------------------------------------------------------------
         -->
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
